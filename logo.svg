<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" role="img" aria-label="DRONOU — Dronou? Então dronou legal.">
  <style>
    .rotor{transform-box:fill-box;transform-origin:center;animation:girar 4.2s linear infinite}
    .rotor.r2{animation-duration:3.4s;animation-direction:reverse}
    @keyframes girar{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){.rotor{animation:none}}
  </style>
  <rect width="640" height="190" rx="30" fill="#073f27"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="76">
    <text x="70" y="104" text-anchor="middle" fill="#ffffff">D</text>
    <text x="132" y="104" text-anchor="middle" fill="#ffffff">R</text>
    <text x="194" y="104" text-anchor="middle" fill="#f2b705">O</text>
    <text x="256" y="104" text-anchor="middle" fill="#ffffff">N</text>
    <text x="318" y="104" text-anchor="middle" fill="#f2b705">O</text>
    <text x="380" y="104" text-anchor="middle" fill="#ffffff">U</text>
  </g>
  <g class="rotor">
    <circle cx="194" cy="78" r="30" fill="none" stroke="#f2b705" stroke-width="5" stroke-dasharray="24 13"/>
    <path d="M164 78h60M194 48v60" stroke="#f2b705" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g class="rotor r2">
    <circle cx="318" cy="78" r="30" fill="none" stroke="#f2b705" stroke-width="5" stroke-dasharray="24 13"/>
    <path d="M288 78h60M318 48v60" stroke="#f2b705" stroke-width="6" stroke-linecap="round"/>
  </g>
  <circle cx="194" cy="78" r="6" fill="#ffffff"/>
  <circle cx="318" cy="78" r="6" fill="#ffffff"/>
  <text x="70" y="152" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#cfe8d8">Dronou? Então dronou legal.</text>
</svg>
