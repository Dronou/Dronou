<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .rotor{transform-box:fill-box;transform-origin:center;animation:girar 4s linear infinite}
    @keyframes girar{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){.rotor{animation:none}}
  </style>
  <rect width="100" height="100" rx="22" fill="#073f27"/>
  <text x="50" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="52" fill="#f2b705">O</text>
  <g class="rotor">
    <circle cx="50" cy="50" r="28" fill="none" stroke="#f2b705" stroke-width="5" stroke-dasharray="15 9"/>
    <path d="M22 50h56M50 22v56" stroke="#f2b705" stroke-width="5" stroke-linecap="round"/>
  </g>
  <circle cx="50" cy="50" r="5" fill="#ffffff"/>
</svg>
